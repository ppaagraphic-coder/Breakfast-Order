<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#0a0a0b">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เลือกอาหารเช้า | Breakfast Selection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600&family=Noto+Serif+Thai:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--ink:#ecece9;--muted:#9a9ea3;--bg:#161718;--card:#212326;--line:#383b3f;--teal:#e6e6e3;--brass:#dcd8cf;--sage:#2d3033;--err:#ff8f84}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Noto Sans Thai",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;padding-bottom:96px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
header{background:#0a0a0b;border-bottom:1px solid var(--line);color:#fff;padding:calc(20px + env(safe-area-inset-top,0px)) 0 28px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{display:flex;align-items:center;min-width:0}.brand img{height:34px;max-width:100%;width:auto;display:block}
.lang{display:flex;border:1px solid rgba(255,255,255,.4);border-radius:99px;overflow:hidden}
.lang button{background:none;border:0;color:#fff;padding:5px 14px;font:inherit;font-size:13px;cursor:pointer}
.lang button[aria-pressed=true]{background:#fff;color:#0a0a0b}
h1{font-family:"Noto Serif Thai",serif;font-weight:700;font-size:28px;line-height:1.3;margin:22px 0 4px}
header p{margin:0;opacity:.85;font-size:15px}
section{margin-top:26px}
h2{font-size:17px;margin:0 0 4px;font-weight:600}
.hint{color:var(--muted);font-size:14px;margin:0 0 12px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 16px;font:inherit;font-size:15px;cursor:pointer;color:var(--ink)}
.chip[aria-pressed=true]{background:var(--teal);border-color:var(--teal);color:#0a0a0b;font-weight:500}
.chip:focus-visible,.card:focus-within,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.sets{display:grid;gap:12px}
.card{position:relative;display:block;background:var(--card);border:1.5px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer}
.card input{position:absolute;opacity:0}
.card.sel{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal)}
.card.off{opacity:.45;cursor:not-allowed}
.ph{aspect-ratio:4/3;background:var(--sage)}.ph img{width:100%;height:100%;object-fit:cover;display:block}.tx{padding:12px 14px 14px}.adj{color:#e2c48f!important}
.card h3{margin:0;font-family:"Noto Serif Thai",serif;font-size:17px}
.card p{margin:2px 0 6px;font-size:14px;color:var(--muted)}
.tag{display:inline-block;font-size:12px;border-radius:6px;padding:1px 8px;background:var(--sage);color:var(--teal);margin-right:6px}
.tag.warn{background:#3b3326;color:#e2c48f}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.stepper button{width:48px;height:48px;border:0;background:none;font-size:22px;cursor:pointer;color:var(--teal)}
.stepper output{min-width:40px;text-align:center;font-weight:600;font-size:18px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input[type=text],textarea{width:100%;font:inherit;font-size:16px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.bar .wrap{padding:0;display:flex;align-items:center;gap:12px}
.sum{flex:1;font-size:14px;color:var(--muted);min-width:0}
.go{background:var(--brass);color:#0a0a0b;border:0;border-radius:12px;padding:14px 26px;font:inherit;font-weight:600;font-size:16px;cursor:pointer}
.go[disabled]{opacity:.5}
.err{color:var(--err);font-size:14px;min-height:1.4em;margin:8px 0 0}
.done{text-align:center;padding:48px 0}
.done .ok{width:72px;height:72px;border-radius:50%;background:var(--teal);color:#0a0a0b;font-size:36px;display:grid;place-items:center;margin:0 auto 16px}
.done dl{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:20px 0}
.done dt{color:var(--muted)}.done dd{margin:0;font-weight:500}
.link{background:none;border:0;color:var(--teal);text-decoration:underline;font:inherit;cursor:pointer}
.demo{background:#3b3326;color:#e2c48f;font-size:13px;padding:6px 16px;text-align:center}
.chip small{display:block;font-size:12px;opacity:.75;line-height:1.3;font-weight:400}.who{margin:14px 0 0;font-size:15px;color:var(--muted)}.pick{margin-top:14px;padding-top:4px;border-top:1px solid var(--line)}.info{margin:6px 0 0;font-size:16px;opacity:.9}[hidden]{display:none!important}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s,box-shadow .15s}}
</style>
</head>
<body>
<div id="demo" class="demo" hidden></div>
<header><div class="wrap">
  <div class="top"><span class="brand" id="brand"></span>
    <div class="lang" role="group" aria-label="Language"><button data-l="th" aria-pressed="true">ไทย</button><button data-l="en" aria-pressed="false">EN</button></div></div>
  <h1 id="title"></h1>
  <p class="info" id="info" hidden></p>
</div></header>

<main class="wrap" id="form">
  <section id="roomSec" hidden>
    <h2 data-t="room"></h2>
    <input type="text" id="room" inputmode="numeric" autocomplete="off" aria-label="room">
  </section>
  <section id="guestSec">
    <h2 data-t="guests"></h2>
    <div class="stepper"><button id="minus" aria-label="-">−</button><output id="gn">1</output><button id="plus" aria-label="+">+</button></div>
  </section>
  <section>
    <div class="row" id="tabs" role="tablist" hidden></div>
    <p class="who" id="who" hidden></p>
  </section>
  <section>
    <h2 data-t="diet"></h2><p class="hint" data-t="dietHint"></p>
    <div class="row" id="diets"></div>
  </section>
  <section>
    <h2 data-t="set"></h2>
    <div class="sets" id="sets" role="radiogroup"></div>
    <p style="margin:12px 0 0"><button class="link" id="copyAll" data-t="copyAll" hidden></button></p>
  </section>
  <section>
    <h2 id="noteH" data-t="note"></h2><p class="hint" data-t="noteHint"></p>
    <textarea id="note" rows="3" maxlength="300"></textarea>
    <p class="err" id="err" role="alert"></p>
  </section>
</main>

<main class="wrap" id="msg" hidden><p id="msgText" style="margin-top:40px;text-align:center;font-size:17px;color:var(--muted)"></p></main>

<main class="wrap" id="done" hidden>
  <div class="done"><div class="ok">✓</div><h1 style="color:var(--teal)" data-t="thanks"></h1><p data-t="thanksSub" style="color:var(--muted)"></p>
  <dl id="recap"></dl><img id="sumImg" alt="" style="display:block;width:100%;max-width:420px;margin:0 auto 14px;border-radius:12px"><button class="go" id="dlImg" data-t="saveImg"></button><p class="hint" data-t="saveHint" style="margin:8px 0 14px"></p><button class="link" id="edit" data-t="edit"></button></div>
</main>

<div class="bar" id="bar"><div class="wrap"><div class="sum" id="sum"></div><button class="go" id="go"></button></div></div>

const q = new URLSearchParams(location.search);
const S = {lang:q.get("lang")==="en"?"en":"th",people:[{set:CONFIG.DEFAULT_SET,diets:new Set(),note:""}],cur:0,tok:(q.get("t")||"").slice(0,40),locked:false,ready:true,touched:new Set(),room:(q.get("room")||"").slice(0,10),name:(q.get("name")||"").slice(0,40)};
const $=id=>document.getElementById(id), T=k=>I18N[S.lang][k];

function blocked(set,diets){const b=new Set();diets.forEach(d=>CONFIG.DIETS.find(x=>x.id===d).block.forEach(x=>b.add(x)));return set.contains.some(c=>b.has(c));}
function render(){
  document.documentElement.lang=S.lang;
  $("brand").innerHTML=`<img src="${LOGO}" alt="${CONFIG.HOTEL_NAME}">`;
  $("title").textContent=(S.name?T("hello")(S.name):"")+T("title");
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=T(e.dataset.t));
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===S.lang));
  $("roomSec").hidden=S.locked||!!q.get("room"); $("room").value=S.room;
  const n=S.people.length,P=S.people[S.cur];
  $("gn").textContent=n;
  $("guestSec").hidden=S.locked;
  $("info").hidden=!(S.locked&&S.room);
  $("info").textContent=T("room")+" "+S.room+" · "+n+" "+T("people");
  const nm=p=>CONFIG.SETS.find(x=>x.id===p.set)[S.lang][0];
  $("tabs").hidden=n<2; $("who").hidden=n<2; $("copyAll").hidden=n<2;
  $("tabs").innerHTML=S.people.map((p,i)=>`<button class="chip" role="tab" data-g="${i}" aria-pressed="${i===S.cur}">${T("guestN")(i+1)}<small>${nm(p)}</small></button>`).join("");
  $("who").textContent=T("choosing")(S.cur+1);
  $("noteH").textContent=T("note")+(n>1?" · "+T("guestN")(S.cur+1):"");
  $("note").value=P.note||"";
  $("diets").innerHTML=CONFIG.DIETS.map(d=>`<button class="chip" data-d="${d.id}" aria-pressed="${P.diets.has(d.id)}">${T(d.id)}</button>`).join("");
  $("sets").innerHTML=CONFIG.SETS.map(s=>{
    const adj=blocked(s,P.diets),tags=[];
    if(s.contains.includes("pork"))tags.push(`<span class="tag warn">${T("tPork")}</span>`);
    if(s.contains.includes("seafood"))tags.push(`<span class="tag warn">${T("tSea")}</span>`);
    if(s.contains.includes("peanut"))tags.push(`<span class="tag warn">${T("tNut")}</span>`);
    return `<label class="card ${P.set===s.id?"sel":""}"><input type="radio" name="set" value="${s.id}" ${P.set===s.id?"checked":""}>
      <div class="ph"><img src="${IMGU[s.id]}" decoding="async" alt="${s[S.lang][0]}"></div><div class="tx"><h3>${s[S.lang][0]}</h3><p>${s[S.lang][1]}</p>${tags.join("")}${adj?`<p class="adj" style="margin:8px 0 0">${T("tAdj")}</p>`:""}</div></label>`}).join("");
  const parts=CONFIG.SETS.map(x=>[x,S.people.filter(p=>p.set===x.id).length]).filter(([x,c])=>c).map(([x,c])=>x[S.lang][0]+(c>1?" ×"+c:"")).join(", ");
  $("sum").textContent=parts+" · "+n+" "+T("people")+" · "+T("restaurant");
  $("go").textContent=T("submit");$("go").disabled=!S.ready;
  if(!S.ready)$("sum").textContent=T("loading");
  if($("demo")){ $("demo").hidden=!!CONFIG.SCRIPT_URL; $("demo").textContent=T("demo"); }
}
document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b)return;
  if(b.dataset.l){S.lang=b.dataset.l;render();}
  else if(b.dataset.g){S.cur=+b.dataset.g;render();}
  else if(b.dataset.d){S.touched.add(S.cur);const D=S.people[S.cur].diets;D.has(b.dataset.d)?D.delete(b.dataset.d):D.add(b.dataset.d);render();}
  else if(b.id==="copyAll"){const c=S.people[S.cur];S.people.forEach((p,i)=>{p.set=c.set;p.diets=new Set(c.diets);S.touched.add(i);});render();}
  else if(b.id==="plus"){if(S.people.length<10){S.people.push({set:CONFIG.DEFAULT_SET,diets:new Set(),note:""});S.cur=S.people.length-1;}render();}
  else if(b.id==="minus"){if(S.people.length>1){S.people.pop();S.cur=Math.min(S.cur,S.people.length-1);}render();}
  else if(b.id==="edit"){$("done").hidden=true;$("form").hidden=false;$("bar").hidden=false;window.scrollTo(0,0);}
});
document.addEventListener("change",e=>{if(e.target.name==="set"){S.touched.add(S.cur);S.people[S.cur].set=e.target.value;render();}});
$("room").addEventListener("input",e=>{S.room=e.target.value.trim();});
$("note").addEventListener("input",e=>{S.people[S.cur].note=e.target.value;S.touched.add(S.cur);});

$("go").addEventListener("click",async()=>{
  const err=$("err");err.textContent="";
  if(!S.ready)return;
  if(CONFIG.CUTOFF_HOUR&&new Date().getHours()>=CONFIG.CUTOFF_HOUR){err.textContent=T("closed");return;}
  if(!S.room){err.textContent=T("eRoom");$("room").focus();return;}
  S.touched.add(S.cur);
  const mk=(p,i)=>{const st=CONFIG.SETS.find(x=>x.id===p.set);return {no:i+1,setId:st.id,setName:st.th[0],setLabel:st[S.lang][0],diets:[...p.diets],note:(p.note||"").trim()};};
  // หลายเครื่องสแกน QR เดียวกัน: ส่งเฉพาะคนที่แก้บนเครื่องนี้ ให้เซิร์ฟเวอร์รวมกับของคนอื่น (ไม่ต้องดึงข้อมูลก่อนส่ง จึงเร็วขึ้น)
  const partial=!!(CONFIG.SCRIPT_URL&&S.tok&&S.people.length>1);
  const send=S.people.map(mk).filter((p,i)=>!partial||S.touched.has(i));
  const order={timestamp:new Date().toISOString(),room:S.room,guest:S.name,guests:S.people.length,partial,people:send.map(p=>({no:p.no,setId:p.setId,setName:p.setName,diets:p.diets.join(","),note:p.note})),place:"restaurant",lang:S.lang,token:S.tok};
  const btn=$("go");btn.disabled=true;btn.textContent=T("sending");
  try{
    if(CONFIG.SCRIPT_URL){
      const init={method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(order)};
      try{
        const r=await fetch(CONFIG.SCRIPT_URL,init);const j=await r.json();if(!j.ok)throw new Error("rejected");
        (j.people||[]).forEach(x=>{const i=x.no-1,P=S.people[i];if(P&&!S.touched.has(i)&&CONFIG.SETS.some(t=>t.id===x.setId)){P.set=x.setId;P.diets=new Set(String(x.diets||"").split(",").filter(d=>CONFIG.DIETS.some(k=>k.id===d)));P.note=String(x.note||"");}});
      }
      catch(x){if(x.message==="rejected")throw x;await fetch(CONFIG.SCRIPT_URL,Object.assign({},init,{mode:"no-cors"}));} // ส่งซ้ำได้ ระบบเขียนทับตาม token
    }else{
      try{const k="breakfastOrders";const a=JSON.parse(localStorage.getItem(k)||"[]");a.push(order);localStorage.setItem(k,JSON.stringify(a));}catch(_){}
      console.log("ORDER (demo)",order);
    }
    const people=S.people.map(mk);
    const rows=[[T("rRoom"),order.room],[T("rPlace"),T("restaurant")]];
    people.forEach(p=>rows.push([T("guestN")(p.no),p.setLabel+(p.diets.length?" ("+p.diets.map(d=>T(d)).join(", ")+")":"")]));
    people.forEach(p=>{if(p.note)rows.push([T("rNote")+(people.length>1?" ("+T("guestN")(p.no)+")":""),p.note]);});
    const dl=$("recap");dl.textContent="";
    rows.forEach(([k,v])=>{const dt=document.createElement("dt"),dd=document.createElement("dd");dt.textContent=k;dd.textContent=v;dl.append(dt,dd);});
    S.sumBlob=null;$("dlImg").disabled=true;$("sumImg").removeAttribute("src");
    $("form").hidden=true;$("bar").hidden=true;$("done").hidden=false;window.scrollTo(0,0);
    // รูปสรุปสร้างหลังแสดงหน้าสำเร็จแล้ว (ไม่ทำให้ผู้ใช้รอ) และเก็บไว้ในเครื่องผู้ใช้เท่านั้น ไม่ส่งไปเซิร์ฟเวอร์
    summaryCanvas(rows,order).then(c=>c.toBlob(bl=>{S.sumBlob=bl;$("sumImg").src=URL.createObjectURL(bl);$("dlImg").disabled=false;},"image/png")).catch(()=>{});
  }catch(_){err.textContent=T("eNet");}
  btn.disabled=!S.ready;btn.textContent=T("submit");
});
function wrapText(g,t,max){const out=[];let l="";for(const ch of String(t)){if(ch==="\n"){out.push(l);l="";continue;}if(g.measureText(l+ch).width>max&&l){out.push(l);l=ch;}else l+=ch;}out.push(l);return out;}

const loadImg=src=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src;});
async function summaryCanvas(rows,order){
  try{await Promise.all(['400 28px "Noto Sans Thai"','600 28px "Noto Sans Thai"'].map(f=>document.fonts.load(f,"ก")));}catch(_){}
  const logo=await loadImg(SUMLOGO);
  const W=800,pad=40,lab=310,F='"Noto Sans Thai",sans-serif',m=document.createElement("canvas").getContext("2d");
  const BG="#26292c",INK="#ecece9",MUTED="#9a9ea3",LINE="#484c50";
  m.font="400 28px "+F;
  const body=rows.map(([k,v])=>({k,lines:wrapText(m,v,W-pad*2-lab)}));
  const lw=420,lh=logo?Math.round(lw*logo.height/logo.width):0,top=pad+lh+(logo?34:0);
  const LH=42,H=top+110+body.reduce((a,r)=>a+Math.max(1,r.lines.length)*LH+10,0)+70;
  const c=document.createElement("canvas");c.width=W;c.height=H;const g=c.getContext("2d");
  g.fillStyle=BG;g.fillRect(0,0,W,H);g.textBaseline="alphabetic";
  if(logo)g.drawImage(logo,pad,pad,lw,lh);else{g.font="600 24px "+F;g.fillStyle=MUTED;g.fillText(CONFIG.HOTEL_NAME,pad,pad+30);}
  g.font="600 38px "+F;g.fillStyle=INK;g.fillText(T("sumTitle"),pad,top+40);
  g.fillStyle=LINE;g.fillRect(pad,top+66,W-pad*2,2);
  let y=top+120;
  body.forEach(r=>{g.font="400 28px "+F;g.fillStyle=MUTED;g.fillText(r.k,pad,y);g.fillStyle=INK;g.font="600 28px "+F;
    r.lines.forEach((l,i)=>g.fillText(l,pad+lab,y+i*LH));y+=Math.max(1,r.lines.length)*LH+10;});
  g.font="400 22px "+F;g.fillStyle=MUTED;g.fillText(new Date(order.timestamp).toLocaleString(S.lang==="en"?"en-GB":"th-TH"),pad,H-28);
  return c;
}
$("dlImg").addEventListener("click",async()=>{
  if(!S.sumBlob)return;
  const name="breakfast-room-"+String(S.room).replace(/[^\w-]/g,"_")+".png",file=new File([S.sumBlob],name,{type:"image/png"});
  // มือถือ: เปิดหน้าต่างแชร์ของเครื่อง เลือก "บันทึกรูปภาพ" ลงแกลเลอรีได้โดยตรง
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return;}}
  catch(e){if(e&&e.name==="AbortError")return;}
  const a=document.createElement("a");a.href=URL.createObjectURL(S.sumBlob);a.download=name;document.body.append(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
});
const setGuests=g=>{S.people=Array.from({length:g},()=>({set:CONFIG.DEFAULT_SET,diets:new Set(),note:""}));S.cur=0;};
async function boot(){
  try{document.fonts.load('400 28px "Noto Sans Thai"',"ก");document.fonts.load('600 28px "Noto Sans Thai"',"ก");}catch(_){}
  const g=parseInt(q.get("guests"),10);
  if(g>=1&&g<=10){setGuests(g);S.locked=true;}
  const useTok=S.tok&&CONFIG.SCRIPT_URL;
  const instant=useTok&&S.locked&&S.room; // QR ใหม่มีห้อง/จำนวนคนในลิงก์: แสดงฟอร์มทันที แล้วตรวจกับชีตเบื้องหลัง
  S.ready=!useTok;
  if(useTok&&!instant){$("form").hidden=true;$("bar").hidden=true;$("msg").hidden=false;$("msgText").textContent=T("loading");}
  render();
  if(!useTok)return;
  try{
    const r=await(await fetch(CONFIG.SCRIPT_URL+"?t="+encodeURIComponent(S.tok))).json();
    if(!r.ok)throw new Error("bad");
    S.room=String(r.room);S.name=r.name||"";
    const n=Math.max(1,Math.min(10,+r.guests||1));
    if(S.people.length!==n){const old=S.people;setGuests(n);old.slice(0,n).forEach((p,i)=>S.people[i]=p);}
    S.cur=Math.min(S.cur,n-1);S.locked=true;
    const a=r.answers||{};
    (a.people||[]).forEach(x=>{const i=x.no-1,P=S.people[i];if(P&&!S.touched.has(i)&&CONFIG.SETS.some(t=>t.id===x.setId)){P.set=x.setId;P.diets=new Set(String(x.diets||"").split(",").filter(d=>CONFIG.DIETS.some(k=>k.id===d)));P.note=String(x.note||"");}});
    if(S.people.length===1&&!S.people[0].note&&a.note&&!S.touched.has(0))S.people[0].note=String(a.note);
    S.ready=true;
    $("msg").hidden=true;$("form").hidden=false;$("bar").hidden=false;render();
  }catch(e){$("form").hidden=true;$("bar").hidden=true;$("msg").hidden=false;$("msgText").textContent=T("badLink");}
}
boot();
